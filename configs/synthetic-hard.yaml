# The 64^3 synthetic corpus at MRI-grade separability - the decisive experiment.
#
#   scripts/generate_data.py --config configs/synthetic-hard.yaml
#   scripts/train.py a --config configs/synthetic-hard.yaml --out runs/hard-stage-a
#   scripts/train.py b --config configs/synthetic-hard.yaml --out runs/hard-stage-b
#
# On the easy synthetic appearance a single global threshold recovers every
# structure at IoU 0.9994, so `B(I)` gets every boundary for free, the carver
# never has to learn a class, and transfer to an unsupervised class is perfect
# and meaningless. Measured: 0.9490 supervised, 0.9504 held out, after one epoch.
#
# The appearance block below scores **0.291**, against 0.9942 for the easy corpus
# and 0.0796 for the real MRI. Everything else is held fixed - random packing (so
# no anatomy prior to exploit), near-oracle anchors, the same architecture and the
# same losses. If transfer collapses here the way it does on MRI, separability is
# the cause and the architecture is not at fault.
#
# It is deliberately NOT at MRI's 0.0796. An earlier attempt hit 0.066 by raising
# the noise and putting the background texture at a structure's own spatial
# scale, and the result was a corpus whose shapes a person could not see at all -
# Stage A reached Dice 0.27 by epoch 6 where the easy corpus reached 0.78 by
# epoch 10. That fails the pipeline for the wrong reason. Local contrast-to-noise
# here is 6.4 against MRI's 0.89: every structure is plainly visible against what
# surrounds it. What is missing is a GLOBAL threshold, which is the thing under
# test.

data:
  root: data/synthetic-mri
  resolution: 64
  n_anchors: 3
  normalize: none            # the generator writes a bounded [0, 1] image
  triples: 60
  locality: 8
  shuffle_clauses: true


# 16 classes in 12 geometric families. The rule: a FAMILY is never split across
# the boundary. The previous split held out `cuboid` while `cube` was supervised,
# and those two are IoU 1.000 at canonical parameters - the identical shape under
# a different name - which is why held-out Dice read 0.962 and meant nothing.
# Measured max IoU from any held-out class to any supervised one is now 0.56.
#
#   supervised families : box{cube,cuboid} ellipsoid{sphere,ellipsoid}
#                         tube{cylinder,capsule} tapered{cone,pyramid}
#                         simplex{tetrahedron} torus{torus}
#   held out            : every non-convex, concave, waisted, curved or bored shape
#
# `torus` stays supervised on purpose: it is the only trained class with a hole,
# so `hollow_cylinder` in val is reachable and the holdout has a difficulty
# gradient instead of being uniformly impossible.
targets:
  train: [cube, cuboid, sphere, ellipsoid, cylinder, capsule, cone, pyramid, tetrahedron, torus]
  val:   [hollow_cylinder, cross, banana]
  test:  [crescent, hourglass, triangular_prism]


# What `scripts/generate_data.py` writes. The appearance IS the experiment.
synthetic:
  scenes: {train: 400, val: 50, test: 50}
  seeds: {train: 1000000, val: 2000000, test: 3000000}
  spacing: [1.0, 1.0, 1.0]
  margin: 2
  packing: {max_object_attempts: 200, max_scene_attempts: 50}
  size: 1.8                    # scales every structure. At 1.0 the primitives are ~8 voxels
                               # across in a 64^3 volume and the carver's stride-2 stem sees
                               # them at four, so Dice measures the discretisation rather than
                               # the shape. At 1.8 they are ~14 voxels and ~2700 voxels each,
                               # which matches the MRI targets' 1631-2322 in absolute count.
                               # It deliberately does NOT widen the spread BETWEEN classes:
                               # a size that identifies a class is the same shortcut as a
                               # brightness that does, and it is the one the MRI carver took -
                               # it learned a class-conditional size prior and predicted 93
                               # voxels where 2219 belonged. The ten classes stay within ~2x.
  appearance:
    # MEASURED FROM data/mri, not invented. Every amplitude below is quoted as a
    # multiple of `separation`, the grey->white gap, so the whole appearance
    # scales with one number. What was measured, in the model's own normalised
    # view (scripts: see docs/proposal/deviations.md):
    #
    #   tissue      CSF -2.17 (11.2% of brain) | grey -0.37 (49.6%) | white +0.98 (39.2%)
    #   separation  grey->white 1.35
    #   texture     a structure's INTERNAL spread is 0.525 = 0.39 x separation,
    #               and the tissue around it carries the same
    #   scale       autocorrelation 0.76 / 0.57 / 0.36 / 0.21 at 1 / 2 / 4 / 8
    #               voxels - roughly exp(-d/4), i.e. structure at MANY scales,
    #               which one Gaussian field cannot produce and octaves can
    #   structures  class means span 1.03 sd and cross the tissue in both
    #               directions: pallidum sits ABOVE white matter, amygdala below
    #               grey, ventricles far below everything
    separation: 0.28           # grey->white, in image units. CSF lands at 0.048.
    grey: 0.42
    tissue_fractions: [0.112, 0.496, 0.392]
    tissue_offsets: [-1.33, 0.0, 1.0]   # in units of `separation`
    texture_sd: 0.39           # x separation, for tissue AND structure interiors
    tissue_length: 3.5         # base octave, tuned to the autocorrelation above

    # Structures draw from a WIDE band spanning the tissue range, so a structure
    # is as likely to be darker than what surrounds it as brighter - which is the
    # single most MRI-like property of the whole appearance, and the one every
    # earlier version missed by painting every structure above its background.
    #
    # `shared` keeps brightness free of class information, so the relational
    # prompt stays the only way to pick the target. That is a DEPARTURE from the
    # MRI, where a class mean is reproducible to 0.104 against a between-class
    # spread of 1.033 and intensity nearly identifies the structure. Replacing
    # `shared` with a number reproduces that regime; it is left off on purpose,
    # because a corpus where brightness names the target cannot test §4.
    structure: [0.10, 0.85]
    class_spread: shared
    noise: 0.010               # white noise only; the real variation is `texture_sd`
    blur: 0.6                  # partial-volume edges

    head: 1.0                  # a closed envelope with air outside: the global frame a
    head_exponent: 4.0         # real volume has and a featureless cube does not
    air: 0.03
    bias_field: 0.30           # a smooth multiplicative inhomogeneity on top

    # Superseded by the measured model above; kept at zero so older configs and
    # the easy corpus still mean what they meant.
    texture: 0.0               # random lumps at the STRUCTURE scale - these were
                               # decoys, and they cost a full Stage A run
    detail: 0.0

model:
  stage_a:
    encoder_channels: [32, 64, 128, 256]   # four widths: three stride-2 stages, 64 -> 8
    bottleneck: 8
    token_dim: 256
    num_heads: 4
    prior_foreground: 0.0016
    deep_supervision: [0.1, 0.3, 0.6]

  stage_b:
    mapper:
      tau: 0.5              # world units, and this corpus is 1.0 unit/voxel
      min_mass: 1.0e-6
    boundary_widths: [16, 32, 32]
    carver:
      width: 16
      blocks: 2
      full_resolution_skip: true
    use_image: true
    # The three anchor MASKS into the carver alongside the fields. Their shapes
    # identify the anchor classes, and the unordered anchor set alone recovers
    # the target 67.8% of the time on data/mri - a channel through which the
    # carver can name the target instead of solving for it. `F_i` and `where_raw`
    # already carry the geometry it needs. The anchor EXCLUSION is unaffected.
    carver_sees_anchors: true
    additive_prior: false
    alpha: 0.35
    background_logit: -10.0
    prior_foreground: 0.0016


train:
  seed: 20260915
  device: auto
  precision: bf16
  batch_size: 16
  accum: 1
  workers: 8
  threshold: 0.5
  loss: {name: dice_bce, lambda_dice: 1.0, lambda_bce: 1.0}
  early_stopping: {patience: 0, min_delta: 0.005}
  probe_examples: 200
  val_examples: 600

  stage_a:
    epochs: 50
    optimizer: {name: adamw, lr: 0.001, weight_decay: 0.00001}
    scheduler: {name: cosine, warmup_epochs: 2}
    augment: true
    prompts_per_item: null

  boundary:
    epochs: 30
    optimizer: {name: adamw, lr: 0.0005, weight_decay: 0.00001}
    scheduler: {name: cosine, warmup_epochs: 2}
    mask_fraction: 0.5
    patch: 8
    loss: {boundary: 1.0, reconstruct: 1.0, edge: 0.5}

  stage_b:
    epochs: 30
    optimizer: {name: adamw, lr: 0.0003, weight_decay: 0.00001}
    scheduler: {name: cosine, warmup_epochs: 2}
    phase_a_checkpoint: runs/mri-stage-a/best.pt
    boundary_checkpoint: null
    boundary_lr_scale: 0.1
    anchor_source: predicted
    flip_probability: 0.25
    loss:
      dice: 1.0
      bce: 1.0
      null_bce: 0.2
      centroid: 0.02
      field_centroid: 0.01
      far: 0.2
    far: {epsilon: 0.05, dilation: 4}
    field_centroid_on: always
    # Withhold one supervised class from the loss each epoch, cycling. Makes the
    # recognise-and-recall route fail DURING training, which is the only pressure
    # that reaches it. `keep = 0` is the existing per-example drop.
    leave_one_out: false


logging:
  # `metrics.jsonl` is written either way; this only mirrors it.
  backend: wandb
  wandb:
    project: spatial-vox
    # `name` falls back to the --out directory name, so every run is identifiable
    # even when it is not set explicitly. Per-arm tags are added with
    # `--set logging.wandb.tags=[...]` at launch.
    tags: [stage-b, synthetic-mri, 16-classes, transfer]


evaluation:
  metrics: [dice, iou, hausdorff]
  hausdorff_percentile: 95
  stratify_by: [target, anchor, direction, slot]
  counterfactuals: [permute_channels, permute_clauses, flip_direction, permute_both]
