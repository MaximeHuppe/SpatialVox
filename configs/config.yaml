# The whole project's configuration. Override any leaf from the command line:
#   scripts/train.py b --set train.stage_b.optimizer.lr=1e-4
#
# Every key here is read by the code, and nothing in `src/` hard-codes a value
# that lives here. The architecture is documented in `documentation/SpatialVox.md`;
# every constant that departs from the value the original proposal started from is
# marked "measured:" and is justified there (Deviations from the original proposal).

data:
  root: data/mri            # corpus directory: images, labels, manifests, vocabulary
  resolution: 128            # cube side the importer writes; must match the corpus
  n_anchors: 3               # clauses per prompt, and anchor mask channels
  normalize: zscore-brain    # none | zscore | zscore-brain. `zscore` uses whole-volume
                             # statistics; with mri.apply_brainmask 66.5% of the volume is
                             # exact zero, which puts tissue at +1.35 sigma with a 0.52 spread
                             # that drifts per subject. `zscore-brain` measures over the brain.

  # Prompts are generated anchor-first: the landmark triple is fixed, then the
  # targets it determines uniquely are kept. Picking the anchors *nearest the
  # target* instead made the anchor identities a name tag - on fixed anatomy the
  # unordered anchor set alone recovered the target 98.9% of the time against
  # 94.5% for solving the conjunction, so ignoring the prompt strictly beat
  # reading it. That generator is gone rather than configurable.
  triples: 60                # candidate triples drawn per scene
  locality: 8                # draw the triple from the k nearest a seed, so clauses
                             # name landmarks a reader would name together
  shuffle_clauses: true      # randomise slot order. false stores the distance ranking in
                             # the slot index, which was worth ~0.11 Dice - never for a real run.


# Stage B target-class split. Every name stays in the vocabulary and may be an
# anchor in every split; only supervision-as-target is restricted.
# `train` selects `best.pt`. `val` and `test` are scored and never selected on.
targets:
  train: [Left-Thalamus, Right-Thalamus, Left-Pallidum, Right-Pallidum,
          Left-Amygdala, Right-Amygdala, Left-Accumbens, Right-Accumbens]
  val:   [Left-Caudate, Right-Caudate, Left-Putamen, Right-Putamen]
  test:  [Left-Hippocampus, Right-Hippocampus]


# Real MRI - the corpus this project trains on. `scripts/import_mri.py` writes
# `scenes/<id>/{image,labels}.nii.gz`, the manifests and the vocabulary, honouring
# every prompt knob in the `data:` block above. Unlisted FreeSurfer / dense ids
# become background. To change a prompt knob afterwards use
# `scripts/rebuild_manifests.py` - seconds, no volumes rewritten.
mri:
  source: /home/imag2/Documents/IMAG2/HCP
  output: data/mri
  n_subjects: 200
  split_seed: 20260919
  subject_fractions: {train: 0.8, val: 0.1, test: 0.1}
  apply_brainmask: true
  aws:
    uri: s3://hcp-openaccess/HCP_1200
    profile: null
  volumes:
    image: [T1w_acpc_dc_restore_1.25.nii.gz, t1.nii.gz]
    labels: [wmparc.nii.gz, mask.nii.gz, aseg.nii.gz]
    brainmask: [brainmask_fs.nii.gz]
  structures:
    Left-Lateral-Ventricle:  {fs: 4,  dense: 3}
    Left-Inf-Lat-Vent:       {fs: 5,  dense: 4}
    Left-Thalamus:           {fs: 10, dense: 7}
    Left-Caudate:            {fs: 11, dense: 8}
    Left-Putamen:            {fs: 12, dense: 9}
    Left-Pallidum:           {fs: 13, dense: 10}
    3rd-Ventricle:           {fs: 14, dense: 11}
    4th-Ventricle:           {fs: 15, dense: 12}
    Brain-Stem:              {fs: 16, dense: 13}
    Left-Hippocampus:        {fs: 17, dense: 14}
    Left-Amygdala:           {fs: 18, dense: 15}
    Left-Accumbens:          {fs: 26, dense: 17}
    Left-VentralDC:          {fs: 28, dense: 18}
    Right-Lateral-Ventricle: {fs: 43, dense: 21}
    Right-Inf-Lat-Vent:      {fs: 44, dense: 22}
    Right-Thalamus:          {fs: 49, dense: 25}
    Right-Caudate:           {fs: 50, dense: 26}
    Right-Putamen:           {fs: 51, dense: 27}
    Right-Pallidum:          {fs: 52, dense: 28}
    Right-Hippocampus:       {fs: 53, dense: 29}
    Right-Amygdala:          {fs: 54, dense: 30}
    Right-Accumbens:         {fs: 58, dense: 31}
    Right-VentralDC:         {fs: 60, dense: 32}


model:
  # Stage A: the promptable segmenter. Trained beforehand on every name that may
  # be an anchor, then frozen inside Stage B. These widths are the ones
  # `runs/phase-a/current` was trained with; a checkpoint carries its own
  # architecture, so this block only matters when Stage A is retrained.
  stage_a:
    encoder_channels: [32, 64, 128, 256, 256]   # one width per scale; five take 128 to 8
    bottleneck: 8                               # checked against the width list, not assumed
    token_dim: 256                              # must equal the last encoder width
    num_heads: 4
    prior_foreground: 0.0016                    # expected foreground fraction; initialises the head bias
    deep_supervision: [0.05, 0.1, 0.25, 0.6]    # loss weight per decoder scale, coarse to fine

  # Stage B: the relational model. No name, pair or slot embedding; no occupancy;
  # no coordinate grid; no candidate list.
  stage_b:
    answer_mode: instance       # instance = seed-flood + where_raw(centroid); carver = B2 parent
    mapper:
      tau: 0.5              # world units (the corpus is 1.25 mm/voxel), the ONLY geometric
                            # constant. measured: the proposal starts at 2.0, where only 65%
                            # of target centroids clear `where_raw > 0.5`; at 0.5 it is 97.4%
                            # (scripts/gate_mapper.py). §2 makes that fraction the gate.
      min_mass: 1.0e-6      # reject an anchor Stage A failed to find, as a fraction of the
                            # volume. measured: the smallest mass a real structure gets from
                            # `runs/phase-a/current` is 3.2e-6, and the proposal's 1e-3 would
                            # reject every structure in the vocabulary.
    boundary_widths: [16, 32, 32]   # B(I): three stages at 128/64/32 and back. Image only.
    instance:
      dilate_radius: 4            # ADR: start at 4; measure coverage vs neighbour invasion
      region_threshold: 0.5
      max_seeds: 16
      intensity_tol: 1.0          # scale on local std(I) around each seed (intensity fallback)
      tol_mode: local_std         # local_std | std | absolute — used only without B features
      feature_tol: 0.30           # 1 - cosine (legacy feature flood; barrier preferred)
      barrier_tol: 0.35           # refuse voxels with P(boundary) above this
      score_null: 0.5             # empty answer when best where_raw(centroid) is below this
    carver:
      width: 16                   # B2 parent path only (`answer_mode: carver`)
      blocks: 2
      full_resolution_skip: true
    use_image: true
    carver_sees_anchors: false    # never feed anchor shapes into the answer path
    additive_prior: false
    alpha: 0.35
    background_logit: -10.0
    prior_foreground: 0.0016


train:
  seed: 20260915
  device: auto                                                    # auto -> cuda, then mps, then cpu
  precision: bf16                                                 # fp32 | bf16 | fp16 (fp16 adds a gradient scaler)
  batch_size: 4
  accum: 1                                                        # optimiser step every `accum` batches
  workers: 4
  threshold: 0.5                                                  # probability cut for a binary mask
  loss: {name: dice_bce, lambda_dice: 1.0, lambda_bce: 1.0}       # Stage A's mask loss
  early_stopping: {patience: 0, min_delta: 0.005}
  probe_examples: 200                                             # examples the per-epoch
                                                                  # counterfactual probes use. They
                                                                  # cost five forward passes each, and
                                                                  # the reported drops come from
                                                                  # scripts/evaluate.py over the whole
                                                                  # split - this is a trend line.
  val_examples: 600                                               # fixed random subset per val curve
                                                                  # (null = all). Anchor-first emits
                                                                  # ~90 prompts/scene, so unsubsampled
                                                                  # validation costs more than training.

  stage_a:
    epochs: 50
    optimizer: {name: adamw, lr: 0.001, weight_decay: 0.00001}
    scheduler: {name: cosine, warmup_epochs: 2}
    augment: true                # one octahedral rotation per item. Stage A only.
    prompts_per_item: null       # sample this many names per scene; null = all

  # Pretraining for B, with objectives that carry no class id: put back blanked
  # cubes of I, mark where two neighbouring voxels differ in label, regress
  # |grad I|. The boundary map is a pretraining target, never an inference input.
  boundary:
    epochs: 30
    optimizer: {name: adamw, lr: 0.0005, weight_decay: 0.00001}
    scheduler: {name: cosine, warmup_epochs: 2}
    mask_fraction: 0.5           # fraction of cubes blanked
    patch: 16                    # cube side, in voxels
    loss: {boundary: 1.0, reconstruct: 1.0, edge: 0.5}

  stage_b:
    epochs: 30
    optimizer: {name: adamw, lr: 0.0003, weight_decay: 0.00001}
    scheduler: {name: cosine, warmup_epochs: 5}
    phase_a_checkpoint: runs/phase-a/current/best.pt   # the frozen Stage A. Always required:
                                        # it is what turns the three names into masks. Prefer
                                        # passing --segmenter explicitly.
    boundary_checkpoint: null           # a `scripts/train.py boundary` run, or null to train B
                                        # from scratch alongside the carver.
    boundary_lr_scale: 0.1              # B's learning rate relative to the carver's, once pretrained
    anchor_source: predicted            # predicted | oracle. `predicted` is the method. `oracle`
                                        # substitutes ground-truth anchor masks and is a diagnostic
                                        # that separates Stage A's error from the architecture's.
    flip_probability: 0.25              # one clause to its opposite, then re-scored. Train only.
    loss:                               # §5's table, one weight per term
      dice: 1.0
      bce: 1.0
      null_bce: 0.2                     # BCE on the null head ("null" alone is a YAML None key)
      centroid: 0.02                    # heatmap against the structure's centroid. The term is
                                        # smooth-L1 in MILLIMETRES summed over three axes, so at a
                                        # 17 mm error it is ~27 before weighting - at 0.1 it would
                                        # be four times the Dice and the carver's trunk would be
                                        # trained mostly to localise. Per-term losses are logged.
      field_centroid: 0.01              # the same, against the field's own centre
      far: 0.2                          # L_far
    far: {epsilon: 0.05, dilation: 8}   # mass outside dilate(where_raw > epsilon) is penalised
    field_centroid_on: always           # always | empty-only. `always` is §5's table read
                                        # literally. Measured: the field's centre of mass sits
                                        # 20.2 mm from the target's centroid (the conjunction is
                                        # an elongated wedge and the target is near its apex), so
                                        # under `always` this term pulls the heatmap ~20 mm off on
                                        # every valid prompt. `empty-only` restricts it to prompts
                                        # that name nothing, where it is the only target there is.
    mask_on: valid                      # valid | all. Which prompts the MASK term supervises.
                                        # `all` also trains prompts that name nothing towards the
                                        # empty mask. Measured (relational-seed1), that taught the
                                        # carver to reject by itself: silent on 94.5% of impossible
                                        # prompts and on 75% of held-out prompts that DO name a
                                        # structure. `valid` never rewards an empty answer, and
                                        # leaves "names nothing" to the null head, whose gate is
                                        # reported beside every Dice. `all` reproduces runs before
                                        # 2026-09-22; see _update_ideas/.


logging:
  backend: wandb              # wandb | none
  wandb:
    project: spatial-vox-mri
    tags: [mri, relational, carver]


evaluation:
  metrics: [dice, iou, hausdorff]
  hausdorff_percentile: 95
  stratify_by: [target, anchor, direction, slot]
  counterfactuals: [permute_channels, permute_clauses, flip_direction, permute_both]
