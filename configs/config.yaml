# The whole project's configuration. Override any leaf from the command line:
#   scripts/train.py b --set train.stage_b.optimizer.lr=1e-4
#
# Every key here is read by the code. The defaults reproduce the runs on
# exp/realistic-appearance; anything marked "reference:" is load-bearing for that,
# and changing it makes a new experiment rather than a rerun.

data:
  root: data/synthetic       # corpus directory: images, labels, manifests, vocabulary
  resolution: 64             # cube side; must match the corpus and model.bottleneck
  spacing: [1.0, 1.0, 1.0]   # world units per voxel, ordered (x, y, z)
  n_anchors: 3               # relations per prompt, and anchor mask channels
  margin: 2                  # voxels every structure must keep from the border
  normalize: none            # reference: none. Use `zscore` for real MRI.


synthetic:
  scenes: {train: 400, val: 50, test: 50}
  seeds: {train: 1000000, val: 2000000, test: 3000000}   # disjoint per split

  packing:
    max_object_attempts: 200   # placements tried per structure before giving up
    max_scene_attempts: 50     # whole-scene retries, each with a fresh seed

  appearance:
    background: [0.12, 0.04]   # mean, std of the noise floor
    structure: [0.45, 0.75]    # one shared, overlapping range of structure means
    class_bias: 0.04           # small T1-like per-class offset; still overlapping
    jitter: 0.05               # per-structure draw around that offset
    noise: 0.03                # intra-structure noise
    blur: 0.6                  # voxels; makes edges partial-volume


targets:
  train: [cube, sphere, cylinder, cone, pyramid, torus, capsule]
  val: [cuboid, ellipsoid]
  test: [triangular_prism]



model:
  encoder_channels: [32, 64, 128, 256]         # channels of the encoder (widths of the encoder blocks)
  bottleneck: 8                                # bottleneck dimension of the encoder
  token_dim: 256                               # dimension of the token embeddings (textual and spatial)
  num_heads: 4                                 # number of attention heads (heads = token_dim / head_dim)
  intersection_hidden: 256                     # width inside Stage B's intersection block
  prior_foreground: 0.0016                     # expected foreground fraction; initialises the head bias
  deep_supervision: [0.1, 0.3, 0.6]            # Stage A loss weights per decoder scale, coarse to fine



train:
  seed: 20260915
  device: auto                                                    # auto -> cuda, then mps, then cpu
  precision: bf16                                                 # fp32 | bf16 | fp16 (fp16 adds a gradient scaler)
  batch_size: 16                                                  # number of samples per batch
  accum: 1                                                        # optimiser step every `accum` batches
  workers: 8                                                      # number of workers for data loading
  threshold: 0.5                                                  # probability cut for a binary mask
  loss: {name: dice_bce, lambda_dice: 1.0, lambda_bce: 1.0}       # loss function and weights
  early_stopping: {patience: 0, min_delta: 0.005}                 # early stopping parameters


  stage_a:
    epochs: 50
    optimizer: {name: adamw, lr: 0.001, weight_decay: 0.00001}
    scheduler: {name: cosine, warmup_epochs: 2}
    augment: false           
    prompts_per_item: null                                         # sample this many structure names per scene; null = all


  stage_b:
    epochs: 30
    optimizer: {name: adamw, lr: 0.0003, weight_decay: 0.00001}
    scheduler: {name: cosine, warmup_epochs: 5}
    augment: true
    mode: predicted                    # predicted | oracle. predicted requires phase_a_checkpoint; oracle uses ground-truth anchors and occupancy.
    phase_a_checkpoint: runs/stage_a_aug/best.pt   # Stage A weights. Required when mode is predicted; ignored when mode is oracle.
    occupancy_mode: anchors-only        # all | anchors-only | none. Which masks of that source are unioned into occupancy.
                             

logging:
  backend: none              # wandb | none
  wandb:
    project: relational-3d-vlm
    tags: [relational-3d-vlm, augmentation, occupancy-volume, dataset-custom]



evaluation:
  metrics: [dice, iou, hausdorff]
  hausdorff_percentile: 95
  stratify_by: [target, anchor, direction, slot]
  counterfactuals: [permute_channels, permute_clauses, flip_direction, permute_both]
